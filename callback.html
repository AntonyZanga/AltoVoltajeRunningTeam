<!DOCTYPE html>
<html>
<head>
    <title>Strava Redirect</title>
    <script type="text/javascript">
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // Primero intentar redirigir a la app Android
                const androidUrl = `myapp://callback?code=${code}`;
                window.location.href = androidUrl;
                
                // Si la app no está instalada, redirigir a la web después de un breve retraso
                setTimeout(function() {
                    if (!document.hidden) {
                        // Si la página sigue visible (app no instalada), redirigir a la web
                        window.location.href = `https://alto-voltaje-running-team.web.app?strava_code=${code}`;
                    }
                }, 100);
            } else {
                // Handle error
                document.body.innerHTML = "Error: no authorization code found.";
            }
        }
    </script>
</head>
<body>
    <p>Redirigiendo...</p>
</body>
</html>
