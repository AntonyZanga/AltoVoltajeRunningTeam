<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback de Strava</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB0Qw5Qw5Qw5Qw5Qw5Qw5Qw5Qw5Qw5Qw5Q",
            authDomain: "alto-voltaje-running-team.firebaseapp.com",
            projectId: "alto-voltaje-running-team",
            storageBucket: "alto-voltaje-running-team.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:1234567890123456789012"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Función para manejar el callback de Strava
        async function handleStravaCallback() {
            try {
                // Obtener el código de autorización de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (!code) {
                    throw new Error('No se recibió el código de autorización de Strava');
                }

                // Intercambiar el código por un token de acceso
                const response = await fetch('https://www.strava.com/oauth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: '127124',
                        client_secret: '50825ee5414cc703024485e972996e8a1fd8131b',
                        code: code,
                        grant_type: 'authorization_code'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Error de Strava: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.access_token) {
                    throw new Error('No se recibió el token de acceso de Strava');
                }

                // Calcular tiempo de expiración (6 horas desde ahora)
                const expiresAt = new Date();
                expiresAt.setHours(expiresAt.getHours() + 6);
                
                // Guardar token en Firestore con tiempo de expiración
                const user = auth.currentUser;
                if (user) {
                    await db.collection('users').doc(user.uid).update({
                        stravaToken: data.access_token,
                        stravaRefreshToken: data.refresh_token,
                        stravaTokenExpiresAt: expiresAt,
                        stravaConnectedAt: new Date()
                    });
                    
                    // Redirigir a la página principal
                    window.location.href = 'https://alto-voltaje-running-team.web.app';
                } else {
                    throw new Error('Usuario no autenticado');
                }
            } catch (error) {
                console.error('Error en el callback de Strava:', error);
                document.getElementById('error-message').textContent = 'Error al conectar con Strava. Por favor, intenta nuevamente.';
            }
        }

        // Ejecutar el manejo del callback cuando la página se carga
        document.addEventListener('DOMContentLoaded', handleStravaCallback);
    </script>
</head>
<body>
    <div id="error-message" style="color: red; text-align: center; margin-top: 20px;"></div>
</body>
</html>
