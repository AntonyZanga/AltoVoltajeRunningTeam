<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirección de Strava</title>
    <script>
        // Obtener el código de autorización de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        // Redirigir a callback.html con el código
        if (code) {
            window.location.href = `callback.html?code=${code}`;
        } else {
            document.body.innerHTML = '<p style="text-align: center; margin-top: 20px;">No se recibió el código de autorización de Strava.</p>';
        }
    </script>
</head>
<body>
</body>
</html>
