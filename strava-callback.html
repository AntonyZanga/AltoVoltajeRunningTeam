<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Strava Callback - Alto Voltaje Running Team</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            updateDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { 
            getAuth, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC_xBPzBxpaW9-79NyrBZMehox35lMdwxo",
            authDomain: "alto-voltaje-running-team.firebaseapp.com",
            projectId: "alto-voltaje-running-team",
            storageBucket: "alto-voltaje-running-team.firebasestorage.app",
            messagingSenderId: "157154969817",
            appId: "1:157154969817:web:3fc5f63a1d2310456156c8",
            measurementId: "G-9VYXX6X598"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Handle Strava callback
        async function handleStravaCallback() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                
                if (!code) {
                    throw new Error('No se recibió el código de autorización de Strava');
                }

                // Wait for auth state to be determined
                return new Promise((resolve, reject) => {
                    const unsubscribe = onAuthStateChanged(auth, async (user) => {
                        unsubscribe(); // Stop listening to auth state changes
                        
                        if (!user) {
                            // If user is not authenticated, store the code and redirect to login
                            localStorage.setItem('pendingStravaCode', code);
                            const baseUrl = window.location.origin;
                            // For iOS, we'll use a more direct approach
                            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                                window.location.href = baseUrl + '/index.html#login';
                            } else {
                                window.location.replace(baseUrl + '/index.html#login');
                            }
                            return;
                        }

                        try {
                            // Exchange code for token
                            const response = await fetch('https://www.strava.com/oauth/token', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    client_id: '127124',
                                    client_secret: '50825ee5414cc703024485e972996e8a1fd8131b',
                                    code: code,
                                    grant_type: 'authorization_code'
                                })
                            });

                            const data = await response.json();
                            if (!response.ok) {
                                throw new Error(data.message || 'Error al obtener el token de Strava');
                            }

                            // Save Strava data to Firestore
                            await updateDoc(doc(db, 'users', user.uid), {
                                stravaId: data.athlete.id,
                                firstname: data.athlete.firstname,
                                lastname: data.athlete.lastname,
                                profile: data.athlete.profile,
                                stravaToken: data.access_token,
                                stravaRefreshToken: data.refresh_token,
                                stravaTokenExpiresAt: new Date(data.expires_at * 1000),
                                stravaConnectedAt: new Date()
                            });

                            // Redirect back to main page with iOS-specific handling
                            const baseUrl = window.location.origin;
                            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                                // For iOS devices, use a more direct approach
                                window.location.href = baseUrl;
                            } else {
                                window.location.replace(baseUrl);
                            }
                            resolve();
                        } catch (error) {
                            console.error('Error en el callback de Strava:', error);
                            document.getElementById('error-message').textContent = error.message;
                            reject(error);
                        }
                    }, (error) => {
                        console.error('Error en la autenticación:', error);
                        document.getElementById('error-message').textContent = 'Error de autenticación';
                        reject(error);
                    });
                });
            } catch (error) {
                console.error('Error en el callback de Strava:', error);
                document.getElementById('error-message').textContent = error.message;
            }
        }

        // Execute callback handler when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Show loading message
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
            
            // Handle the callback
            handleStravaCallback().catch(error => {
                console.error('Error en el callback:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
            });
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            -webkit-tap-highlight-color: transparent;
        }
        #loading {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        #error-message {
            color: red;
            text-align: center;
            max-width: 80%;
            margin: 0 auto;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="loading">Procesando autorización de Strava...</div>
    <div id="error-message" style="display: none;"></div>
</body>
</html>
